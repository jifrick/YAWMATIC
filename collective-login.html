<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Creator Portal Login — YAWMATIC Collective</title>
  <meta name="description" content="Sign in to your YAWMATIC Collective Creator Dashboard.">

  <!-- Favicons -->
  <link rel="icon" type="image/png" href="/logo_y_only.png">
  <link rel="apple-touch-icon" href="/logo_y_only.png">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Syne:wght@700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/css/style.css">
  <style>
    .auth-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 120px 24px 60px;
      position: relative;
      z-index: 2;
    }
    .auth-card {
      background: var(--card-bg);
      border: 1px solid var(--glass-border);
      border-radius: 8px;
      padding: 44px 40px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6);
      position: relative;
    }
    .auth-badge {
      font-family: var(--font-display);
      font-size: 0.72rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--fire);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .auth-badge::before {
      content: '';
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--fire);
    }
    .auth-title {
      font-family: var(--font-display);
      font-size: 1.8rem;
      font-weight: 800;
      text-transform: uppercase;
      color: var(--volt);
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }
    .auth-subtitle {
      font-size: 0.88rem;
      color: var(--mist);
      line-height: 1.5;
      margin-bottom: 28px;
    }
    .form-group {
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .form-label {
      font-family: var(--font-display);
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--mist);
    }
    .form-input {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--glass-border);
      border-radius: 4px;
      padding: 12px 14px;
      color: var(--volt);
      font-family: var(--font-body);
      font-size: 0.95rem;
      outline: none;
      transition: var(--transition-fast);
    }
    .form-input:focus {
      border-color: var(--fire);
      background: rgba(255, 255, 255, 0.04);
    }
    .auth-footer {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.82rem;
    }
    .auth-footer a {
      color: var(--mist);
      text-decoration: none;
      transition: var(--transition-fast);
    }
    .auth-footer a:hover {
      color: var(--fire);
    }
    .auth-error {
      background: rgba(255, 23, 68, 0.1);
      border: 1px solid rgba(255, 23, 68, 0.3);
      color: #ff5252;
      padding: 10px 14px;
      border-radius: 4px;
      font-size: 0.82rem;
      margin-bottom: 18px;
      display: none;
    }
  </style>
</head>
<body class="loading">

  <!-- Navbar -->
  <nav class="navbar magnetic-wrap">
    <a href="/" class="navbar__logo magnetic">
      <img src="/logo_dark_theme.png" alt="YAWMATIC" class="logo-wordmark-img">
    </a>
    <ul class="navbar__menu">
      <li><a href="/" class="navbar__link magnetic">Home</a></li>
      <li><a href="/creators/browse" class="navbar__link magnetic">Collective</a></li>
      <li><a href="/creators/apply" class="navbar__link magnetic">Apply</a></li>
    </ul>
    <div class="magnetic-wrap navbar__cta">
      <a href="/contact" class="btn btn--ghost magnetic">Let's Talk →</a>
    </div>
  </nav>

  <main class="auth-page">
    <div class="auth-card">
      <div class="auth-badge">Collective Portal</div>
      <h1 class="auth-title">Creator Login</h1>
      <p class="auth-subtitle">Access your verified YAWMATIC Collective Dashboard to manage your profile, equipment specs, and showcase projects.</p>

      <div id="auth-error-box" class="auth-error"></div>

      <form id="creator-login-form">
        <div class="form-group">
          <label class="form-label" for="login-identifier">Creator Login ID</label>
          <input type="text" id="login-identifier" class="form-input" placeholder="e.g. YAW-CRE-0001" required autocomplete="username" spellcheck="false" autocapitalize="characters">
          <span style="font-size:0.75rem; color:var(--mist);">Assigned upon administrator approval</span>
        </div>

        <div class="form-group">
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <label class="form-label" for="login-password">Password</label>
            <a href="/creator-forgot-password" style="font-size:0.75rem; color:var(--fire); text-decoration:none;">Forgot?</a>
          </div>
          <div style="position:relative; display:flex; align-items:center;">
            <input type="password" id="login-password" class="form-input" placeholder="••••••••••••" required autocomplete="current-password" style="width:100%; padding-right:40px;">
            <button type="button" id="btn-toggle-pwd" aria-label="Show or hide password" style="position:absolute; right:10px; background:transparent; border:none; color:var(--mist); cursor:pointer; padding:4px;">
              <svg id="eye-icon" style="width:16px;height:16px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>

        <div class="form-group" style="flex-direction:row; align-items:center; gap:8px; margin-top:-6px; margin-bottom:14px;">
          <input type="checkbox" id="login-remember" style="accent-color:var(--fire); cursor:pointer;">
          <label for="login-remember" style="font-size:0.8rem; color:var(--mist); cursor:pointer;">Remember Login ID on this device</label>
        </div>

        <button type="submit" id="btn-login-submit" class="btn btn--primary" style="width: 100%; justify-content: center; margin-top: 10px;">
          Sign In to Dashboard →
        </button>
      </form>

      <div class="auth-footer">
        <span>Not yet approved?</span>
        <a href="/creators/apply">Submit Application →</a>
      </div>
    </div>
  </main>

  <script src="/js/main.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script>
    const SUPABASE_URL = 'https://nopqslszbntoqewnemby.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5vcHFzbHN6Ym50b3Fld25lbWJ5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM5MzI4ODEsImV4cCI6MjA5OTUwODg4MX0.cYeWIUVNQ85rWuj811UpAflUXHAixDR8C0_qSxlD4C4';
    const supabaseClient = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

    document.addEventListener('DOMContentLoaded', async () => {
      // Check existing session
      if (supabaseClient) {
        const { data: { session } } = await supabaseClient.auth.getSession();
        if (session) {
          window.location.replace('/creator-dashboard');
          return;
        }
      }

      // Password visibility toggle
      const pwdInput = document.getElementById('login-password');
      const toggleBtn = document.getElementById('btn-toggle-pwd');
      if (toggleBtn && pwdInput) {
        toggleBtn.addEventListener('click', () => {
          const isPwd = pwdInput.type === 'password';
          pwdInput.type = isPwd ? 'text' : 'password';
          toggleBtn.innerHTML = isPwd
            ? `<svg style="width:16px;height:16px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>`
            : `<svg style="width:16px;height:16px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`;
        });
      }

      // Remember login ID retrieval
      const rememberedId = localStorage.getItem('yawmatic_remember_creator_id');
      const identInput = document.getElementById('login-identifier');
      const remCheckbox = document.getElementById('login-remember');
      if (rememberedId && identInput) {
        identInput.value = rememberedId;
        if (remCheckbox) remCheckbox.checked = true;
      }

      const form = document.getElementById('creator-login-form');
      const errBox = document.getElementById('auth-error-box');
      const submitBtn = document.getElementById('btn-login-submit');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        errBox.style.display = 'none';
        submitBtn.disabled = true;
        submitBtn.textContent = 'Authenticating...';

        const rawIdentifier = document.getElementById('login-identifier').value.trim();
        const password = document.getElementById('login-password').value;

        // Save or clear remember-me preference
        if (remCheckbox && remCheckbox.checked) {
          localStorage.setItem('yawmatic_remember_creator_id', rawIdentifier);
        } else {
          localStorage.removeItem('yawmatic_remember_creator_id');
        }

        try {
          const normalized = rawIdentifier.toUpperCase();

          // Reject raw email format on visible login field to protect identity privacy
          if (rawIdentifier.includes('@')) {
            throw new Error('Please sign in using your assigned Creator Login ID (e.g. YAW-CRE-0001).');
          }

          // 1. Authenticate via secure serverless endpoint
          let serverLoginSuccess = false;
          try {
            const apiRes = await fetch('/api/creator-login', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                loginId: normalized,
                password: password
              })
            });

            const apiData = await apiRes.json().catch(() => ({}));
            if (apiRes.ok && apiData.success && apiData.session) {
              serverLoginSuccess = true;
              if (supabaseClient) {
                await supabaseClient.auth.setSession({
                  access_token: apiData.session.access_token,
                  refresh_token: apiData.session.refresh_token
                });
              }
              window.location.replace('/creator-dashboard');
              return;
            } else if (!apiRes.ok && apiRes.status !== 404) {
              throw new Error(apiData.message || 'Invalid Creator Login ID or password. Please verify your credentials.');
            }
          } catch (apiErr) {
            if (serverLoginSuccess) return;
            if (apiErr.message && !apiErr.message.includes('fetch')) {
              throw apiErr;
            }
          }

          // 2. Direct fallback lookup (if API endpoint is unreachable)
          const { data: matchedRecord, error: lookupErr } = await supabaseClient
            .from('creator_applications')
            .select('id, email, status, profile_data')
            .or(`profile_data->>creator_login_id.eq.${normalized},profile_data->>member_id.eq.${normalized}`)
            .limit(1)
            .maybeSingle();

          if (lookupErr || !matchedRecord || !matchedRecord.email) {
            throw new Error('Invalid Creator Login ID or password. Please verify your credentials.');
          }

          if (matchedRecord.status === 'suspended') {
            throw new Error('This creator account has been suspended by administration. Please contact YAWMATIC.');
          }

          if (matchedRecord.status !== 'approved') {
            throw new Error('This account is still under review or pending administrator approval.');
          }

          const { data, error } = await supabaseClient.auth.signInWithPassword({
            email: matchedRecord.email,
            password: password
          });

          if (error) {
            throw new Error('Invalid Creator Login ID or password. Please verify your credentials.');
          }

          window.location.replace('/creator-dashboard');
        } catch (err) {
          errBox.textContent = err.message || 'Invalid Creator Login ID or password.';
          errBox.style.display = 'block';
          submitBtn.disabled = false;
          submitBtn.textContent = 'Sign In to Dashboard →';
        }
      });
    });
  </script>
</body>
</html>
